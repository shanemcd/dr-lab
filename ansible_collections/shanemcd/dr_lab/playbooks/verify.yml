---
- name: Verification stage
  hosts: all
  become: true
  gather_facts: false

  pre_tasks:
    - name: Resolve the workspace identity
      ansible.builtin.import_role:
        name: shanemcd.dr_lab.workspace

  tasks:
    - name: Run the verify role
      ansible.builtin.import_role:
        name: shanemcd.dr_lab.verify
