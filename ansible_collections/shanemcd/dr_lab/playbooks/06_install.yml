---
- name: Cluster install stage (drive each SNO to convergence)
  hosts: all
  become: true
  gather_facts: false

  pre_tasks:
    - name: Resolve the workspace identity
      ansible.builtin.import_role:
        name: shanemcd.dr_lab.workspace

  tasks:
    - name: Run the cluster_install role
      ansible.builtin.import_role:
        name: shanemcd.dr_lab.cluster_install
