---
- name: Cluster VM stage (hub, compact masters and temporary bootstraps)
  hosts: all
  become: true
  gather_facts: false

  pre_tasks:
    - name: Resolve the workspace identity
      ansible.builtin.import_role:
        name: shanemcd.dr_lab.workspace

  tasks:
    - name: Configure API and ingress load balancing before starting guests
      ansible.builtin.import_role:
        name: shanemcd.dr_lab.loadbalancer

    - name: Run the vms role
      ansible.builtin.import_role:
        name: shanemcd.dr_lab.vms
