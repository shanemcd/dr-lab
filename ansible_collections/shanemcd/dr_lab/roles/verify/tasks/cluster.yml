---
# Cluster state checks for exactly one SNO cluster ({{ sno_node.name }}):
# node Ready, clusterversion Available at the pinned version, operators
# Available, machine config pools Updated.

- name: Set per-cluster facts
  ansible.builtin.set_fact:
    cluster_name: "{{ sno_node.name }}"
    verify_expected_members: "{{ lab_nodes | selectattr('cluster', 'equalto', sno_node.name) | list }}"
    cluster_kubeconfig: "{{ install_base_dir }}/{{ sno_node.name }}/auth/kubeconfig"

- name: Wait for the cluster to settle
  # Read-only settle gate: verification asserts steady state, not a
  # momentary one. One poller over the whole operator table.
  ansible.builtin.shell: |
    set -o pipefail
    # cluster-api excluded: platform=None installs keep it Progressing
    # (Uninitialized) forever — upstream steady state, not a fault.
    bad=$("{{ install_bin_dir }}/oc" get clusteroperators --no-headers 2>/dev/null \
      | awk '$1 != "cluster-api" && ($3 != "True" || $5 == "True") {print $1"("$3"/"$5")"}' | grep . || true)
    cv=$("{{ install_bin_dir }}/oc" get clusterversion \
      -o 'jsonpath={.items[0].status.conditions[?(@.type=="Available")].status}' 2>/dev/null)
    if [ -n "${bad}" ] || [ "${cv}" != "True" ]; then
      echo "unsettled: operators not Available=${bad:-none} clusterversion Available=${cv}" >&2
      exit 1
    fi
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: verify_cluster_settle
  until: verify_cluster_settle.rc == 0
  retries: "{{ verify_cluster_settle_retries }}"
  delay: "{{ verify_cluster_settle_delay_seconds }}"
  changed_when: false

- name: Read the node states
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - get
      - nodes
      - "-o"
      - 'jsonpath={range .items[*]}{.metadata.name}{" "}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}'
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: verify_nodes
  changed_when: false

- name: Read the clusterversion state
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - get
      - clusterversion
      - "-o"
      - 'jsonpath={.items[0].status.desired.version}{"\n"}{.items[0].status.conditions[?(@.type=="Available")].status}{"\n"}'
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: verify_clusterversion
  changed_when: false

- name: Wait for every machine config pool to report Updated
  # Pool convergence can trail the operator settle gate: rolling updates
  # are normal (not Degraded) operation, so machine-config reports
  # Available while nodes still apply their renders. Poll until every
  # expected pool reports Updated=True instead of reading once.
  vars:
    verify_mcp_wait_args: >-
      {{ ['get', 'mcp'] + verify_mcp_expected_names
         + ['-o', 'jsonpath={range .items[*]}{.metadata.name}{" "}'
            ~ '{.status.conditions[?(@.type=="Updated")].status}{"\n"}{end}'] }}
  ansible.builtin.command:
    argv: "{{ [install_bin_dir ~ '/oc'] + verify_mcp_wait_args }}"
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: verify_mcp_wait
  until: >-
    verify_mcp_wait.stdout_lines | select('search', ' True$') | list | length
    == verify_mcp_expected_names | length
  retries: "{{ verify_mcp_wait_retries }}"
  delay: "{{ verify_mcp_wait_delay_seconds }}"
  changed_when: false

- name: Read the machine config pool states
  vars:
    verify_mcp_args: >-
      {{ ['get', 'mcp'] + verify_mcp_expected_names
         + ['-o', 'jsonpath={range .items[*]}{.metadata.name}{" "}'
            ~ '{.status.conditions[?(@.type=="Updated")].status}{"\n"}{end}'] }}
  ansible.builtin.command:
    argv: "{{ [install_bin_dir ~ '/oc'] + verify_mcp_args }}"
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: verify_mcps
  changed_when: false

- name: Read the cluster operator states
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - get
      - clusteroperators
      - "-o"
      - 'jsonpath={range .items[*]}{.metadata.name}{" "}{.status.conditions[?(@.type=="Available")].status}{"\n"}{end}'
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: verify_operators
  changed_when: false

- name: Assert the cluster state ({{ cluster_name }})
  vars:
    verify_ready_count: "{{ verify_nodes.stdout_lines
                             | select('search', ' True$') | list | length }}"
    verify_mcp_updated_count: "{{ verify_mcps.stdout_lines
                                   | select('search', ' True$') | list | length }}"
    verify_operators_total: "{{ verify_operators.stdout_lines | list | length }}"
    verify_operators_available: "{{ verify_operators.stdout_lines
                                    | select('search', ' True$') | list | length }}"
  ansible.builtin.assert:
    that:
      - verify_nodes.stdout_lines | length == verify_expected_members | length
      - >-
        verify_nodes.stdout_lines | map('regex_replace', ' True$', '') | sort
        == verify_expected_members | map(attribute='name') | sort
      - verify_ready_count | int == verify_expected_members | length
      - verify_clusterversion.stdout_lines | length == 2
      - verify_clusterversion.stdout_lines[0] | trim == ocp_version
      - verify_clusterversion.stdout_lines[1] | trim == 'True'
      - verify_mcp_updated_count | int == verify_mcp_expected_names | length
      - verify_operators_total | int > 0
      - verify_operators_available | int == verify_operators_total | int
    fail_msg: >-
      {{ cluster_name }} cluster state check failed — nodes: {{
      verify_nodes.stdout_lines | default([]) | join('; ') }};
      clusterversion: {{ verify_clusterversion.stdout | default('') | trim }};
      mcps: {{ verify_mcps.stdout_lines | default([]) | join('; ') }};
      operators: {{ verify_operators_available | int }} of
      {{ verify_operators_total | int }} Available.
    success_msg: >-
      {{ cluster_name }}: node Ready, clusterversion
      {{ verify_clusterversion.stdout_lines[0] | trim }} Available,
      operators Available, pools Updated.

- name: Collect the cluster evidence
  ansible.builtin.set_fact:
    verify_cluster_report: >-
      {{ verify_cluster_report | default({})
         | combine({cluster_name: {
              'nodes': verify_nodes.stdout_lines,
              'clusterversion': verify_clusterversion.stdout_lines | map('trim') | list,
              'mcps': verify_mcps.stdout_lines,
              'operators_available': verify_operators.stdout_lines | select('search', ' True$') | list | length,
              'operators_total': verify_operators.stdout_lines | list | length,
              'domain_states': (verify_domain_state.results
                                | selectattr('item.cluster', 'equalto', cluster_name)
                                | map(attribute='stdout') | list) }}) }}
