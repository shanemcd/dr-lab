---
# Stages run as root (libvirt, /etc), so artifacts they create land
# root-owned in the invoking user's home. At the end of a run, hand those
# trees back: chown only files that are actually root-owned.
- name: Hand root-owned lab artifacts back to the workspace owner
  ansible.builtin.shell: |
    set -o pipefail
    find {{ item }} -user root -print0 |
      xargs -0 -r chown {{ lab_workspace_identity.uid }}:{{ lab_workspace_identity.gid }}
  loop:
    - "{{ install_base_dir }}"
    - "{{ vm_assets_dir }}"
    - "{{ artifacts_downloads_dir }}"
    - "{{ kubeconfig_controller_path | dirname }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
  tags: [always]
