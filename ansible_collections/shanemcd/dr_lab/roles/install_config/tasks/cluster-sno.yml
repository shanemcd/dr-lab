---
# Per-cluster install-config + BiP ignition, for exactly one SNO
# ({{ sno_node.name }}). Paths derive from cluster_name (see paths.yml).

- name: Resolve the hub SNO node facts
  # Bootstrap-in-place: exactly one node — the master.
  ansible.builtin.set_fact:
    sno_node: "{{ lab_nodes | selectattr('cluster', 'equalto', cluster_name) | first }}"

- name: Ensure the cluster install directory
  ansible.builtin.file:
    path: "{{ install_dir }}"
    state: directory
    mode: "0700"

- name: Stat existing ignition artifacts
  ansible.builtin.stat:
    path: "{{ install_dir }}/{{ item }}"
  loop:
    - "{{ install_config_metadata_name }}"
    - "{{ install_config_bip_name }}"
  register: install_config_existing

- name: Set ignition generation state facts
  ansible.builtin.set_fact:
    install_config_ignition_complete: >-
      {{ install_config_existing.results
         | map(attribute='stat.exists')
         | select('equalto', false) | list | length == 0 }}
    install_config_bip_mtime: >-
      {{ (install_config_existing.results
          | selectattr('item', 'equalto', install_config_bip_name)
          | map(attribute='stat.mtime') | list | first) | default(0) | int }}

- name: Set ignition age fact
  ansible.builtin.set_fact:
    install_config_ignition_age_hours: >-
      {{ ((ansible_date_time.epoch | int - install_config_bip_mtime)
          / 3600) | round(1) }}

- name: Set ignition staleness fact
  ansible.builtin.set_fact:
    install_config_ignition_stale: >-
      {{ install_config_ignition_complete | bool
         and (install_config_ignition_age_hours | float
              > ignition_fresh_window_hours | int) }}

- name: Assert existing ignition is usable
  # Fresh ignition is always fine (reused); bootstrap certificates are
  # only valid ~24h, so anything past the window must be regenerated from
  # scratch (a consumed BiP install cannot be resumed).
  ansible.builtin.assert:
    that:
      - not install_config_ignition_stale | bool
    fail_msg: >-
      Ignition under {{ install_dir }} is
      {{ install_config_ignition_age_hours }}h old (window
      {{ ignition_fresh_window_hours }}h) — bootstrap certificates have
      likely expired. Run the teardown playbook, then re-run to generate
      fresh ignition.
  when: install_config_ignition_complete | bool

- name: Guard against partial or consumed install state
  ansible.builtin.assert:
    that:
      - >-
        install_config_existing.results
        | map(attribute='stat.exists') | select('equalto', true)
        | list | length == 0
    fail_msg: >-
      Partial or consumed install artifacts under {{ install_dir }} — run the
      teardown playbook first (fresh-dir guard).
  when: not install_config_ignition_complete | bool

- name: Generate manifests and the BiP ignition
  when: not install_config_ignition_complete | bool
  block:

    - name: Render the install config
      ansible.builtin.template:
        src: install-config.yaml.j2
        dest: "{{ install_dir }}/{{ install_config_name }}"
        mode: "0600"
      no_log: true

    - name: Keep the pristine install config copy
      ansible.builtin.copy:
        src: "{{ install_dir }}/{{ install_config_name }}"
        dest: "{{ install_dir }}/{{ install_config_pristine_name }}"
        remote_src: true
        mode: "0600"
      no_log: true

    - name: Create manifests
      ansible.builtin.command:
        argv:
          - "{{ install_bin_dir }}/openshift-install"
          - create
          - manifests
          - "--dir"
          - "{{ install_dir }}"
      changed_when: true

    - name: Set SNO master hostname base64 fact
      ansible.builtin.set_fact:
        install_config_mc_hostname_b64: "{{ (sno_node.name ~ '\n') | b64encode }}"

    - name: Ensure the custom manifests directory
      ansible.builtin.file:
        path: "{{ install_dir }}/openshift"
        state: directory
        mode: "0700"

    - name: Render the master node MachineConfig
      # SNO has exactly one master, so the role-scoped MC is node-scoped:
      # it persists the master hostname onto the installed master via the
      # bootstrap MCS (coreos-installer -n copies only NM connections).
      # /etc/hosts is deliberately NOT managed here — see the template
      # comment (openshift-dns node-resolver owns /etc/hosts).
      ansible.builtin.template:
        src: lab-node-machineconfig.yaml.j2
        dest: "{{ install_dir }}/openshift/{{ install_config_hosts_mc_name_prefix }}-master.yaml"
        mode: "0600"
      vars:
        mc_role: "master"
        mc_hostname_b64: "{{ install_config_mc_hostname_b64 }}"

    - name: Render synchronized guest time MachineConfig
      ansible.builtin.template:
        src: lab-chrony-machineconfig.yaml.j2
        dest: "{{ install_dir }}/openshift/99-dr-lab-master-chrony.yaml"
        mode: "0600"

    - name: Create the single-node (bootstrap-in-place) ignition config
      ansible.builtin.command:
        argv:
          - "{{ install_bin_dir }}/openshift-install"
          - create
          - single-node-ignition-config
          - "--dir"
          - "{{ install_dir }}"
      changed_when: true

    - name: Set ignition artifact permissions
      ansible.builtin.file:
        path: "{{ install_dir }}/{{ install_config_bip_name }}"
        mode: "0600"

    - name: Harden the auth directory permissions
      ansible.builtin.file:
        path: "{{ install_dir }}/{{ install_config_auth_dir_name }}"
        state: directory
        mode: "0700"

    - name: Harden auth file permissions
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0600"
      loop:
        - "{{ install_dir }}/{{ install_config_kubeconfig_name }}"
        - "{{ install_dir }}/{{ install_config_kubeadmin_password_name }}"

- name: Stat the installer kubeconfig
  ansible.builtin.stat:
    path: "{{ kubeconfig_path }}"
  register: install_config_kubeconfig_stat

- name: Ensure the controller kubeconfig directory exists
  # Runs unconditionally (outside the fresh-install block) so resumed
  # runs also publish the copy — k8s-module roles need it even when the
  # ignition stage is entirely skipped.
  ansible.builtin.file:
    path: "{{ kubeconfigs_dir }}"
    state: directory
    owner: "{{ lab_workspace_identity.uid }}"
    group: "{{ lab_workspace_identity.gid }}"
    mode: "0700"
  when: install_config_kubeconfig_stat.stat.exists

- name: Publish a controller-readable kubeconfig copy
  # The workspace role also makes the original installer auth directory
  # user-owned; both locations remain private (0700 dir / 0600 kubeconfig).
  ansible.builtin.copy:
    src: "{{ kubeconfig_path }}"
    dest: "{{ kubeconfigs_dir }}/{{ cluster_name }}.kubeconfig"
    owner: "{{ lab_workspace_identity.uid }}"
    group: "{{ lab_workspace_identity.gid }}"
    mode: "0600"
    remote_src: true
  when: install_config_kubeconfig_stat.stat.exists

- name: Read the install metadata
  ansible.builtin.slurp:
    src: "{{ install_dir }}/{{ install_config_metadata_name }}"
  register: install_config_metadata_raw

- name: Set install metadata fact
  ansible.builtin.set_fact:
    install_config_metadata: "{{ install_config_metadata_raw.content | b64decode | from_json }}"

- name: Assemble the per-node ignition config
  # Merged BiP ignition (live-env network + hostname + /etc/hosts). The
  # merge is content-aware: the script only rewrites an output whose
  # content would change, so re-runs are idempotent and edits to the
  # inputs (resolver, keyfile, taxonomy) propagate automatically.
  ansible.builtin.command:
    argv:
      - python3
      - "{{ install_config_merge_script_path }}"
      - node
      - "{{ install_dir }}/{{ install_config_bip_name }}"
      - "{{ vm_ignition_dir }}/{{ sno_node.name }}.ign"
      - "{{ sno_node.name }}"
      - "{{ sno_node.ip }}"
      - "{{ install_config_node_prefix_len }}"
      - "{{ lab_gateway_ip }}"
      - "{{ mac_base }}:{{ sno_node.mac_suffix }}"
      - "{{ lab_gateway_ip }}"
      - "{{ install_config_hosts_snippet_path }}"
  register: install_config_node_merge
  changed_when: "'MERGED' in install_config_node_merge.stdout"

- name: Set per-node ignition permissions
  ansible.builtin.file:
    path: "{{ vm_ignition_dir }}/{{ sno_node.name }}.ign"
    mode: "0600"

- name: Stat the per-node ignition artifact
  ansible.builtin.stat:
    path: "{{ vm_ignition_dir }}/{{ sno_node.name }}.ign"
  register: install_config_node_stat

- name: Read the BiP ignition for content verification
  ansible.builtin.slurp:
    src: "{{ install_dir }}/{{ install_config_bip_name }}"
  register: install_config_bip_raw

- name: Read the merged node ignition for content verification
  ansible.builtin.slurp:
    src: "{{ vm_ignition_dir }}/{{ sno_node.name }}.ign"
  register: install_config_node_merged_raw

- name: Assert ignition generation and content
  ansible.builtin.assert:
    that:
      # installer outputs present at 0600
      - install_config_bip_raw.content | length > 0
      - install_config_node_stat.stat.exists
      - install_config_node_stat.stat.mode == '0600'
      - install_config_metadata.infraID is search('^' ~ cluster_name)
      - install_config_pull_secret_stat.stat.mode == '0600'
      # BiP shape: install-to-disk unit + our custom node MC embedded
      - "'install-to-disk.service' in (install_config_bip_raw.content | b64decode)"
      - >-
        (install_config_hosts_mc_name_prefix ~ '-master.yaml')
        in (install_config_bip_raw.content | b64decode)
      # merged node ignition carries the per-node plumbing
      - "'/etc/hostname' in (install_config_node_merged_raw.content | b64decode)"
      - >-
        (install_config_nm_connection_file)
        in (install_config_node_merged_raw.content | b64decode)
      # the lab resolver must be the NM keyfile's DNS (fetch-time name
      # resolution depends on it)
      - >-
        ('dns=' ~ lab_gateway_ip)
        in (install_config_node_merged_raw.content | b64decode | from_json).storage.files
           | selectattr('path', 'equalto',
                        '/etc/NetworkManager/system-connections/'
                        ~ install_config_nm_connection_file)
           | map(attribute='contents.source') | first
           | regex_replace('^.*,') | b64decode
      - >-
        (install_config_node_merged_raw.content | b64decode | from_json).storage.files
        | selectattr('path', 'equalto', '/etc/hostname')
        | map(attribute='contents.source') | first
        | regex_replace('^.*,') | b64decode == sno_node.name ~ '\n'
    fail_msg: >-
      Ignition generation verification failed for {{ sno_node.name }} — node
      stat {{ install_config_node_stat.stat | default({}) }}, metadata
      {{ install_config_metadata | default({}) }}.

- name: Stat generated credentials
  ansible.builtin.stat:
    path: "{{ install_dir }}/{{ item }}"
  loop:
    - "{{ install_config_kubeconfig_name }}"
    - "{{ install_config_kubeadmin_password_name }}"
    - "{{ install_config_pristine_name }}"
  register: install_config_credentials

- name: Assert credentials exist with mode 0600
  ansible.builtin.assert:
    that:
      - >-
        install_config_credentials.results
        | map(attribute='stat.exists') | select('equalto', true) | list | length == 3
      - >-
        install_config_credentials.results
        | map(attribute='stat.mode') | select('equalto', '0600') | list | length == 3
    fail_msg: >-
      Missing or wrong-mode credentials under {{ install_dir }} — expected
      kubeconfig, kubeadmin-password, and the pristine install config at 0600.

- name: Stat the current BiP ignition for the generation stamp
  ansible.builtin.stat:
    path: "{{ install_dir }}/{{ install_config_bip_name }}"
  register: install_config_bip_stat_now

- name: Write the ignition generation stamp
  ansible.builtin.copy:
    content: >-
      {{ '%Y-%m-%dT%H:%M:%SZ'
         | strftime(second=install_config_bip_stat_now.stat.mtime | int, utc=true) }}
    dest: "{{ install_dir }}/{{ install_config_stamp_name }}"
    mode: "0600"

- name: Cluster install config summary
  ansible.builtin.debug:
    msg: >-
      {{ sno_node.name }} ignition OK (BiP) — infraID
      {{ install_config_metadata.infraID }}, age
      {{ install_config_ignition_age_hours }}h (window
      {{ ignition_fresh_window_hours }}h), generated this run:
      {{ not install_config_ignition_complete | bool }}; node ignition =
      merged BiP (install-to-disk → {{ bip_installation_disk }}) staged at
      0600 in {{ vm_ignition_dir }}/{{ sno_node.name }}.ign for fw_cfg
      delivery.
