---
# Per-cluster install-config + ignition dispatch ({{ cluster.name }}).
# Flavor-specific paths: cluster-sno.yml (bootstrap-in-place, hub) and
# cluster-compact.yml (real UPI with bootstrap + master ignition).

- name: Set per-cluster facts
  ansible.builtin.set_fact:
    cluster_name: "{{ cluster.name }}"
    cluster_network_cidr: "{{ cluster.cluster_network_cidr }}"
    service_network_cidr: "{{ cluster.service_network_cidr }}"
    cluster_flavor: "{{ cluster.install_flavor }}"
    control_plane_replicas: >-
      {{ 1 if cluster.install_flavor == 'sno'
         else (cluster.masters | length) }}

- name: Ensure the cluster install directory
  ansible.builtin.file:
    path: "{{ install_dir }}"
    state: directory
    mode: "0700"

- name: Run the flavor-specific install config path
  ansible.builtin.include_tasks: "cluster-{{ cluster_flavor }}.yml"
