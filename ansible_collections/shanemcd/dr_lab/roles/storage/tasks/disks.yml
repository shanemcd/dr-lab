---
# Attach the ODF data disks (mon + OSDs) to a spoke VM. Sparse raw images
# in the libvirt runtime tree. The virt machine model exposes a fixed set
# of pcie-root-port controllers and PCI controllers cannot be hot plugged,
# so spare root ports and the disks are persisted with --config and the
# guest is gracefully restarted once to expose them. Idempotent: attached
# disks are left alone and no restart happens on a clean re-run.
- name: Pair the disk names with their virtio targets
  ansible.builtin.set_fact:
    storage_disks: >-
      {{ range(1, storage_local_devices | length + 1)
         | map('regex_replace', '^(.*)$',
              storage_node.name ~ '-' ~ storage_disk_prefix ~ '\1.raw')
         | list
         | zip(storage_local_devices | map('regex_replace', '^/dev/', '') | list) }}

- name: Read the domain's current block devices
  ansible.builtin.command:
    argv: [virsh, -c, "{{ libvirt_uri }}", domblklist, "{{ storage_node.name }}"]
  register: storage_domblk
  changed_when: false
  check_mode: false
  environment: {LC_ALL: C}

- name: Set the missing-disk fact
  ansible.builtin.set_fact:
    storage_disks_missing: >-
      {{ storage_disks
         | rejectattr(0, 'in', storage_domblk.stdout_lines
                      | map('regex_replace', '^\\s*\\S+\\s+', '')
                      | map('trim') | map('basename') | list)
         | list }}

- name: Require a graceful restart when disks are being added
  when: storage_disks_missing | length > 0
  ansible.builtin.set_fact:
    storage_restart_needed: true

- name: Read the domain's persistent XML chassis numbers
  ansible.builtin.command:
    argv: [virsh, -c, "{{ libvirt_uri }}", dumpxml, "{{ storage_node.name }}", --inactive]
  register: storage_dumpxml
  changed_when: false
  check_mode: false

- name: Set the next free PCI chassis number
  ansible.builtin.set_fact:
    storage_next_chassis: >-
      {{ ((storage_dumpxml.stdout | regex_findall("chassis='(\d+)'") | map('int') | list) + [4]) | max + 1 }}

- name: Set the chassis numbers for the spare root ports
  ansible.builtin.set_fact:
    storage_port_specs: >-
      {{ range(storage_next_chassis,
               storage_next_chassis + (storage_disks_missing | length)) | list }}

- name: Render a pcie-root-port XML per missing disk
  ansible.builtin.copy:
    dest: "/tmp/{{ storage_node.name }}-rp-{{ item }}.xml"
    mode: "0600"
    content: "{{ lookup('template', role_path ~ '/templates/pcie-root-port.xml.j2') }}"
  loop: "{{ storage_port_specs }}"
  when:
    - not ansible_check_mode
    - storage_disks_missing | length > 0

- name: Persist a spare pcie-root-port per missing disk
  # PCI controllers cannot be hot plugged; --config lands them in the
  # persistent domain XML for the restart below.
  ansible.builtin.command:
    argv:
      - virsh
      - "-c"
      - "{{ libvirt_uri }}"
      - attach-device
      - "{{ storage_node.name }}"
      - "/tmp/{{ storage_node.name }}-rp-{{ item }}.xml"
      - --config
  loop: "{{ storage_port_specs }}"
  loop_control:
    label: "chassis {{ item }}"
  when:
    - not ansible_check_mode
    - storage_disks_missing | length > 0
  register: storage_rootport
  changed_when: true

- name: Create each missing data disk image
  ansible.builtin.command:
    argv:
      - qemu-img
      - create
      - "-f"
      - raw
      - "{{ libvirt_runtime_dir }}/{{ item.0 }}"
      - "{{ storage_disk_size }}"
  loop: "{{ storage_disks_missing }}"
  loop_control:
    label: "{{ item.0 }}"
  when: not ansible_check_mode
  register: storage_disk_create
  changed_when: true

- name: Persist each missing data disk
  ansible.builtin.command:
    argv:
      - virsh
      - "-c"
      - "{{ libvirt_uri }}"
      - attach-disk
      - "{{ storage_node.name }}"
      - "{{ libvirt_runtime_dir }}/{{ item.0 }}"
      - "{{ item.1 }}"
      - "--driver"
      - qemu
      - "--subdriver"
      - raw
      - "--targetbus"
      - virtio
      - "--config"
  loop: "{{ storage_disks_missing }}"
  loop_control:
    label: "{{ item.0 }}"
  when: not ansible_check_mode
  register: storage_attach
  changed_when: true

- name: Gracefully restart the spoke to expose the new disks
  when:
    - not ansible_check_mode
    - storage_restart_needed | default(false)
  ansible.builtin.include_tasks: restart.yml
