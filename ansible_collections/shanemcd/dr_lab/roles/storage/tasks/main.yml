---
- name: Require known compact storage clusters
  ansible.builtin.assert:
    that:
      - storage_clusters | length == 2
      - storage_clusters | difference(compact_clusters | map(attribute='name') | list) | length == 0
      - storage_local_devices == ['/dev/vdb']
    fail_msg: Storage requires two three-master clusters with dedicated /dev/vdb disks.

- name: Converge three-node internal ODF on each managed cluster
  ansible.builtin.include_tasks: cluster.yml
  loop: "{{ clusters | selectattr('name', 'in', storage_clusters) | list }}"
  loop_control:
    loop_var: storage_cluster
    label: "{{ storage_cluster.name }}"
