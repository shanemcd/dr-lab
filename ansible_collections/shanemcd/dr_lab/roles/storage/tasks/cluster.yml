---
# Per-cluster compact single-node ODF install (the working ocp-lab
# design): LSO turns the extra virtio disks into localblock PVs, then the
# odf-operator StorageCluster runs 1 mon + 3 replica-1 OSDs with
# flexibleScaling. Deliberately `oc` and not kubernetes.core.k8s (same
# convention as cluster_install): the k8s action plugin reads the
# kubeconfig on the controller as the invoking user, and the per-cluster
# kubeconfigs are root-owned 0600.

- name: Set per-cluster facts
  ansible.builtin.set_fact:
    cluster_name: "{{ sno_node.name }}"
    cluster_kubeconfig: "{{ install_base_dir }}/{{ sno_node.name }}/auth/kubeconfig"

- name: Ensure the Local Storage Operator namespace
  ansible.builtin.command:
    argv: ["{{ install_bin_dir }}/oc", apply, "-f", "-"]
    stdin: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: {{ storage_lso_namespace }}
        labels:
          openshift.io/cluster-monitoring: "true"
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: storage_lso_ns
  changed_when: "'created' in storage_lso_ns.stdout"

- name: Ensure the Local Storage OperatorGroup and Subscription
  ansible.builtin.command:
    argv: ["{{ install_bin_dir }}/oc", apply, "-f", "-"]
    stdin: |
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: {{ storage_lso_namespace }}
        namespace: {{ storage_lso_namespace }}
      spec:
        targetNamespaces:
          - {{ storage_lso_namespace }}
      ---
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: local-storage-operator
        namespace: {{ storage_lso_namespace }}
      spec:
        channel: {{ storage_lso_channel }}
        installPlanApproval: Automatic
        name: local-storage-operator
        source: redhat-operators
        sourceNamespace: openshift-marketplace
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: storage_lso_sub
  changed_when: "'created' in storage_lso_sub.stdout"

- name: Wait for the Local Storage Operator deployment
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - wait
      - -n
      - "{{ storage_lso_namespace }}"
      - deployment/local-storage-operator
      - --for=condition=Available
      - --timeout=600s
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  changed_when: false

- name: Ensure the LocalVolumeSet over the ODF data disks
  ansible.builtin.command:
    argv: ["{{ install_bin_dir }}/oc", apply, "-f", "-"]
    stdin: |
      apiVersion: local.storage.openshift.io/v1alpha1
      kind: LocalVolumeSet
      metadata:
        name: odf-localvolumeset
        namespace: {{ storage_lso_namespace }}
      spec:
        # LSO 4.22 discovery: deviceInclusionSpec + maxDeviceCount. The
        # data disks are selected by size — the 200G install disk (vda)
        # falls outside the window and is never picked up.
        deviceInclusionSpec:
          deviceTypes:
            - disk
          minSize: {{ storage_lso_min_size }}
          maxSize: {{ storage_lso_max_size }}
        maxDeviceCount: {{ storage_local_devices | length }}
        nodeSelector:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - {{ sno_node.name }}
        storageClassName: {{ storage_lso_storageclass }}
        volumeMode: Block
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: storage_lvs
  changed_when: "'created' in storage_lvs.stdout or 'configured' in storage_lvs.stdout"

- name: Wait for the localblock PVs
  # PVs carry the LocalVolumeSet owner labels, not a storageclass label,
  # and expose phase rather than conditions.
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - wait
      - pv
      - "-l"
      - storage.openshift.com/owner-name=odf-localvolumeset,kubernetes.io/hostname={{ sno_node.name }}
      - "--for=jsonpath={.status.phase}=Available"
      - --timeout=600s
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  changed_when: false

- name: Ensure the ODF namespace
  ansible.builtin.command:
    argv: ["{{ install_bin_dir }}/oc", apply, "-f", "-"]
    stdin: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: {{ storage_odf_namespace }}
        labels:
          openshift.io/cluster-monitoring: "true"
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: storage_odf_ns
  changed_when: "'created' in storage_odf_ns.stdout"

- name: Ensure the ODF OperatorGroup and Subscription
  ansible.builtin.command:
    argv: ["{{ install_bin_dir }}/oc", apply, "-f", "-"]
    stdin: |
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: {{ storage_odf_operatorgroup }}
        namespace: {{ storage_odf_namespace }}
      spec:
        targetNamespaces:
          - {{ storage_odf_namespace }}
      ---
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: odf-operator
        namespace: {{ storage_odf_namespace }}
      spec:
        channel: {{ storage_odf_channel }}
        installPlanApproval: Automatic
        name: odf-operator
        source: redhat-operators
        sourceNamespace: openshift-marketplace
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: storage_odf_sub
  changed_when: "'created' in storage_odf_sub.stdout"

- name: Wait for the ODF operator deployments
  # The deployment only exists once OLM has rolled the CSV out, so an
  # early NotFound is retried rather than fatal.
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - wait
      - -n
      - "{{ storage_odf_namespace }}"
      - deployment/ocs-operator
      - --for=condition=Available
      - --timeout=1200s
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: storage_ocs_wait
  until: storage_ocs_wait.rc == 0
  retries: 60
  delay: 20
  changed_when: false

- name: Enable the ocs-operator single-node mode (CSV)
  # SINGLE_NODE=true drops the 3-node minimum in the topology reconcile
  # (ocs-operator pkg/util/k8sutil.go SingleNodeEnvVar). OLM reverts direct
  # deployment edits, so the env must be injected into the CSV — OLM then
  # reconciles the deployment with it. Re-applied after every operator
  # upgrade. Idempotent: only adds the env entry when missing.
  ansible.builtin.shell: |
    set -o pipefail
    if {{ install_bin_dir }}/oc -n {{ storage_odf_namespace }} get deploy ocs-operator \
        -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="SINGLE_NODE")].value}' | grep -q true; then
      exit 0  # already set on the deployment (and therefore the CSV)
    fi
    CSV=$({{ install_bin_dir }}/oc -n {{ storage_odf_namespace }} get csv -o name | grep ocs-operator | head -1)
    {{ install_bin_dir }}/oc -n {{ storage_odf_namespace }} patch "$CSV" --type=json \
      -p '[{"op":"add","path":"/spec/install/spec/deployments/0/spec/template/spec/containers/0/env/-","value":{"name":"SINGLE_NODE","value":"true"}}]'
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: storage_single_node_csv
  changed_when: "'patched' in storage_single_node_csv.stdout"

- name: Wait for the ocs-operator rollout
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - rollout
      - status
      - -n
      - "{{ storage_odf_namespace }}"
      - deployment/ocs-operator
      - --timeout=300s
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  changed_when: false

- name: Label the node for ODF placement
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - label
      - node
      - "{{ sno_node.name }}"
      - cluster.ocs.openshift.io/openshift-storage=
      - --overwrite
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: storage_nodelabel
  changed_when: "'labeled' in storage_nodelabel.stdout or 'labeled' in storage_nodelabel.stderr"

- name: Ensure the compact single-node StorageCluster
  ansible.builtin.command:
    argv: ["{{ install_bin_dir }}/oc", apply, "-f", "-"]
    stdin: |
      apiVersion: ocs.openshift.io/v1
      kind: StorageCluster
      metadata:
        name: {{ storage_cluster_name }}
        namespace: {{ storage_odf_namespace }}
        annotations:
          # Skips the 3-node topology requirement — the documented
          # single-node/local-dev ODF pattern.
          cluster.ocs.openshift.io/local-devices: "true"
          uninstall.ocs.openshift.io/cleanup-policy: delete
          uninstall.ocs.openshift.io/mode: graceful
      spec:
        # SNO pattern (per the working ocp-lab design): the mon runs from
        # a hostPath instead of a PVC — monPVCTemplate would force 3-node
        # mon placement ("not enough nodes found: expected 3, found 1").
        monDataDirHostPath: /var/lib/rook
        manageNodes: false
        # Lean sizing for the resource-constrained SNO lab — ODF defaults
        # (osd 2cpu/5Gi, mon 1cpu/2Gi) overrun a single compact node.
        resources:
          mon:
            requests:
              cpu: 500m
              memory: 1Gi
          mgr:
            requests:
              cpu: 500m
              memory: 1Gi
        storageDeviceSets:
          - name: osd
            count: {{ storage_osd_count }}
            replica: 1
            portable: false
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
            dataPVCTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                storageClassName: {{ storage_lso_storageclass }}
                volumeMode: Block
                resources:
                  requests:
                    storage: {{ storage_disk_size }}
        flexibleScaling: true
        # NooBaa/MCG is not needed for RBD DR — skip it entirely.
        multiCloudGateway:
          reconcileStrategy: ignore
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: storage_sc
  changed_when: "'created' in storage_sc.stdout or 'configured' in storage_sc.stdout"

- name: Force failureDomain host on the StorageCluster status
  # Released ocs-operator 4.22 maps the SINGLE_NODE failure domain "osd" to
  # an empty topology key (the "osd"->hostname mapping is master-only), which
  # makes the rook version-detect job invalid (empty TSC topologyKey). Patch
  # the status to "host" — setFailureDomain keeps a pre-set domain. Idempotent.
  ansible.builtin.shell: |
    set -o pipefail
    FD=$({{ install_bin_dir }}/oc -n {{ storage_odf_namespace }} get storagecluster {{ storage_cluster_name }} -o jsonpath='{.status.failureDomain}')
    if [ "$FD" = "host" ]; then exit 0; fi
    {{ install_bin_dir }}/oc -n {{ storage_odf_namespace }} patch storagecluster {{ storage_cluster_name }} --subresource=status --type merge -p '{"status":{"failureDomain":"host"}}'
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: storage_fd_patch
  changed_when: "'patched' in storage_fd_patch.stdout"

- name: Wait for the StorageCluster to become Available
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - wait
      - -n
      - "{{ storage_odf_namespace }}"
      - storagecluster/{{ storage_cluster_name }}
      - --for=condition=Available
      - --timeout=3600s
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  changed_when: false

- name: Wait for the CephCluster to be Ready with HEALTH_OK
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - "-n"
      - "{{ storage_odf_namespace }}"
      - get
      - cephcluster
      - "-o"
      - jsonpath={.items[0].status.phase}
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: storage_ceph_phase
  until: storage_ceph_phase.stdout == "Ready"
  retries: 120
  delay: 30
  changed_when: false
