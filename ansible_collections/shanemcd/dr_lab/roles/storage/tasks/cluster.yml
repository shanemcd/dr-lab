---
- name: Select cluster credentials and storage members
  ansible.builtin.set_fact:
    cluster_kubeconfig: "{{ install_base_dir }}/{{ storage_cluster.name }}/auth/kubeconfig"
    storage_members: "{{ lab_nodes | selectattr('cluster', 'equalto', storage_cluster.name) | list }}"

- name: Require three independent storage nodes
  ansible.builtin.assert:
    that:
      - storage_members | length == 3
      - storage_members | map(attribute='name') | unique | length == 3

- name: Label storage nodes for ODF placement
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - label
      - node
      - "{{ item.name }}"
      - 'cluster.ocs.openshift.io/openshift-storage='
      - '--overwrite'
  loop: "{{ storage_members }}"
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: storage_node_label
  changed_when: "'not labeled' not in storage_node_label.stdout"

- name: Install LSO and ODF through supported subscriptions
  ansible.builtin.include_tasks: operator.yml
  loop:
    - name: local-storage-operator
      namespace: "{{ storage_lso_namespace }}"
      channel: "{{ storage_lso_channel }}"
      deployment: local-storage-operator
    - name: odf-operator
      namespace: "{{ storage_odf_namespace }}"
      channel: "{{ storage_odf_channel }}"
      deployment: ocs-operator
  loop_control:
    loop_var: storage_operator
    label: "{{ storage_operator.name }}"

- name: Create local block volumes only on the dedicated data disks
  ansible.builtin.command:
    argv: ["{{ install_bin_dir }}/oc", apply, '-f', '-']
    stdin: |
      apiVersion: local.storage.openshift.io/v1
      kind: LocalVolume
      metadata:
        name: odf-local-disks
        namespace: {{ storage_lso_namespace }}
      spec:
        nodeSelector:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: {{ storage_members | map(attribute='name') | list | to_json }}
        storageClassDevices:
          - storageClassName: {{ storage_lso_storageclass }}
            volumeMode: Block
            devicePaths: {{ storage_local_devices | to_json }}
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: storage_local_apply
  changed_when: "'created' in storage_local_apply.stdout or 'configured' in storage_local_apply.stdout"

- name: Require one local block PV per selected node
  ansible.builtin.shell: |
    set -euo pipefail
    {{ install_bin_dir }}/oc get pv -o json | python3 -c '
    import json, sys
    pvs = [p for p in json.load(sys.stdin)["items"]
           if p["spec"].get("storageClassName") == {{ storage_lso_storageclass | to_json }}
           and p["status"]["phase"] in ("Available", "Bound")]
    assert len(pvs) == 3, "Expected exactly three usable localblock PVs"
    hosts = []
    for pv in pvs:
        assert pv["spec"].get("volumeMode") == "Block", "Expected block PV"
        assert pv["spec"].get("local", {}).get("path"), "Expected local disk path"
        terms = pv["spec"]["nodeAffinity"]["required"]["nodeSelectorTerms"]
        assert terms, "Missing PV node affinity"
        pv_hosts = set()
        for term in terms:
            # Terms are ORed: EVERY alternative must pin exactly one host.
            expressions = [expr for expr in term.get("matchExpressions", [])
                           if expr["key"] == "kubernetes.io/hostname" and expr["operator"] == "In"]
            assert len(expressions) == 1, "Expected explicit hostname affinity"
            values = expressions[0]["values"]
            assert len(values) == 1, "PV must be pinned to one host"
            pv_hosts.update(values)
        assert len(pv_hosts) == 1, "PV alternatives must select the same host"
        hosts.append(pv_hosts.pop())
    assert len(set(hosts)) == 3, "Expected one disk per distinct host"
    assert set(hosts) == set({{ storage_members | map(attribute='name') | list | to_json }}), hosts
    '
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: storage_pvs_ready
  until: storage_pvs_ready.rc == 0
  retries: 120
  delay: 10
  changed_when: false

- name: Create standard three-node internal StorageCluster
  ansible.builtin.command:
    argv: ["{{ install_bin_dir }}/oc", apply, '-f', '-']
    stdin: |
      apiVersion: ocs.openshift.io/v1
      kind: StorageCluster
      metadata:
        name: {{ storage_cluster_name }}
        namespace: {{ storage_odf_namespace }}
      spec:
        manageNodes: false
        monDataDirHostPath: /var/lib/rook
        storageDeviceSets:
          - name: ocs-deviceset
            count: 1
            replica: 3
            portable: false
            dataPVCTemplate:
              spec:
                storageClassName: {{ storage_lso_storageclass }}
                accessModes: [ReadWriteOnce]
                volumeMode: Block
                resources:
                  requests:
                    storage: {{ storage_device_request }}
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: storage_sc_apply
  changed_when: "'created' in storage_sc_apply.stdout or 'configured' in storage_sc_apply.stdout"

- name: Wait for StorageCluster readiness
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - get
      - storagecluster
      - "{{ storage_cluster_name }}"
      - '-n'
      - "{{ storage_odf_namespace }}"
      - '-o'
      - 'jsonpath={.status.phase}'
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: storage_sc_ready
  until: storage_sc_ready.rc == 0 and storage_sc_ready.stdout == 'Ready'
  retries: 240
  delay: 10
  changed_when: false

- name: Require Ceph health OK
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - get
      - cephcluster
      - "{{ storage_cluster_name }}-cephcluster"
      - '-n'
      - "{{ storage_odf_namespace }}"
      - '-o'
      - 'jsonpath={.status.ceph.health}'
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: storage_ceph_health
  until: storage_ceph_health.rc == 0 and storage_ceph_health.stdout == 'HEALTH_OK'
  retries: 120
  delay: 10
  changed_when: false

- name: Verify dynamically provisioned RBD PVC
  ansible.builtin.include_tasks: smoke.yml

- name: Verify NooBaa and dynamically provisioned object storage
  ansible.builtin.include_tasks: object-smoke.yml
