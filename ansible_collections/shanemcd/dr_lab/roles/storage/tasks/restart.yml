---
# Gracefully restart a spoke VM so PCI controllers and disks persisted
# with --config materialize, then wait for the cluster API to come back.
- name: Shut down the spoke VM
  ansible.builtin.command:
    argv: [virsh, -c, "{{ libvirt_uri }}", shutdown, "{{ storage_node.name }}"]
  changed_when: true

- name: Wait for the VM to reach the shut-off state
  ansible.builtin.command:
    argv: [virsh, -c, "{{ libvirt_uri }}", domstate, "{{ storage_node.name }}"]
  register: storage_domstate
  until: storage_domstate.stdout == "shut off"
  retries: 60
  delay: 5
  changed_when: false

- name: Start the spoke VM again
  ansible.builtin.command:
    argv: [virsh, -c, "{{ libvirt_uri }}", start, "{{ storage_node.name }}"]
  changed_when: true

- name: Wait for the cluster API to come back
  ansible.builtin.uri:
    url: "https://api.{{ storage_node.name }}.{{ base_domain }}:6443/readyz"
    validate_certs: false
    status_code: 200
  register: storage_readyz
  until: storage_readyz.status == 200
  retries: 120
  delay: 10
