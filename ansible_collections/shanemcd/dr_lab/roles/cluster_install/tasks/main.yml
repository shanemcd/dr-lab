---
- name: Ensure installer helper directory
  ansible.builtin.file:
    path: "{{ vm_scripts_dir }}"
    state: directory
    mode: '0755'

- name: Install scoped CSR approval and installer wait helpers
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ vm_scripts_dir }}/{{ item }}"
    mode: '0755'
  loop: [approve-node-csrs.py, wait-install.py]

- name: Inspect cluster credentials
  ansible.builtin.stat:
    path: "{{ install_base_dir }}/{{ item.name }}/auth/kubeconfig"
  loop: "{{ clusters }}"
  register: cluster_install_kubeconfig_stat

- name: Require generated cluster credentials
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "Missing kubeconfig for {{ item.item.name }}; run 04_ignition first."
  loop: "{{ cluster_install_kubeconfig_stat.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Converge each cluster
  ansible.builtin.include_tasks: cluster.yml
  loop: "{{ clusters }}"
  loop_control:
    loop_var: install_cluster
    label: "{{ install_cluster.name }}"
