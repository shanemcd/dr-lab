---
- name: Set cluster identity
  ansible.builtin.set_fact:
    cluster_name: "{{ install_cluster.name }}"
    cluster_kubeconfig: "{{ install_base_dir }}/{{ install_cluster.name }}/auth/kubeconfig"
    cluster_install_members: "{{ lab_nodes | selectattr('cluster', 'equalto', install_cluster.name) | list }}"

- name: Build allowed certificate identities
  ansible.builtin.set_fact:
    cluster_install_identities: >-
      {{ dict(cluster_install_members | map(attribute='name')
         | zip(cluster_install_members | map(attribute='ip'))) }}

- name: Inspect bootstrap completion
  ansible.builtin.stat:
    path: "{{ install_base_dir }}/{{ cluster_name }}/bootstrap-complete"
  register: cluster_install_bootstrap_marker

- name: Wait for compact bootstrap completion while approving inventory node CSRs
  ansible.builtin.command:
    argv:
      - python3
      - "{{ vm_scripts_dir }}/wait-install.py"
      - "{{ install_bin_dir }}/openshift-install"
      - "{{ install_base_dir }}/{{ cluster_name }}"
      - bootstrap-complete
      - "{{ install_bin_dir }}/oc"
      - "{{ cluster_install_identities | to_json }}"
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  when:
    - install_cluster.install_flavor == 'compact'
    - not cluster_install_bootstrap_marker.stat.exists
  changed_when: true

- name: Record confirmed bootstrap completion
  ansible.builtin.copy:
    content: "Installer confirmed bootstrap-complete.\n"
    dest: "{{ install_base_dir }}/{{ cluster_name }}/bootstrap-complete"
    mode: '0600'
    force: false
  when: install_cluster.install_flavor == 'compact'

- name: Remove completed bootstrap from the load balancer
  ansible.builtin.include_role:
    name: shanemcd.dr_lab.loadbalancer
  when: install_cluster.install_flavor == 'compact'

- name: Inspect temporary bootstrap domain
  ansible.builtin.command:
    argv: [virsh, '-c', "{{ libvirt_uri }}", list, '--all', '--name']
  register: cluster_install_domains
  changed_when: false
  when: install_cluster.install_flavor == 'compact'

- name: Read bootstrap domain ownership
  ansible.builtin.command:
    argv: [virsh, '-c', "{{ libvirt_uri }}", domuuid, "{{ cluster_name }}-bootstrap"]
  register: cluster_install_bootstrap_uuid
  changed_when: false
  when:
    - install_cluster.install_flavor == 'compact'
    - cluster_name ~ '-bootstrap' in cluster_install_domains.stdout_lines

- name: Refuse to remove an unrelated bootstrap domain
  ansible.builtin.assert:
    that: cluster_install_bootstrap_uuid.stdout | trim == ((cluster_name ~ '-bootstrap') | to_uuid)
  when:
    - install_cluster.install_flavor == 'compact'
    - cluster_name ~ '-bootstrap' in cluster_install_domains.stdout_lines

- name: Stop completed bootstrap if running
  ansible.builtin.shell: |
    set -euo pipefail
    state=$(virsh -c {{ libvirt_uri | quote }} domstate {{ (cluster_name ~ '-bootstrap') | quote }})
    if [ "$state" != 'shut off' ]; then
      virsh -c {{ libvirt_uri | quote }} destroy {{ (cluster_name ~ '-bootstrap') | quote }}
      echo STOPPED
    fi
  environment: {LC_ALL: C}
  register: cluster_install_bootstrap_stop
  changed_when: "'STOPPED' in cluster_install_bootstrap_stop.stdout"
  when:
    - install_cluster.install_flavor == 'compact'
    - cluster_name ~ '-bootstrap' in cluster_install_domains.stdout_lines

- name: Undefine completed bootstrap including UEFI variables
  ansible.builtin.command:
    argv: [virsh, '-c', "{{ libvirt_uri }}", undefine, "{{ cluster_name }}-bootstrap", '--nvram']
  when:
    - install_cluster.install_flavor == 'compact'
    - cluster_name ~ '-bootstrap' in cluster_install_domains.stdout_lines
  changed_when: true

- name: Wait for installer-confirmed cluster completion
  ansible.builtin.command:
    argv:
      - python3
      - "{{ vm_scripts_dir }}/wait-install.py"
      - "{{ install_bin_dir }}/openshift-install"
      - "{{ install_base_dir }}/{{ cluster_name }}"
      - install-complete
      - "{{ install_bin_dir }}/oc"
      - "{{ cluster_install_identities | to_json }}"
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  changed_when: false

- name: Read installed nodes
  ansible.builtin.command:
    argv: ["{{ install_bin_dir }}/oc", get, nodes, '-o', json, '--request-timeout=30s']
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: cluster_install_nodes
  changed_when: false

- name: Require exactly the inventory nodes and Ready condition on each
  ansible.builtin.assert:
    that:
      - >-
        (cluster_install_nodes.stdout | from_json)['items'] | map(attribute='metadata.name') | sort
        == cluster_install_members | map(attribute='name') | sort
      - >-
        (cluster_install_nodes.stdout | from_json)['items'] | map(attribute='status.conditions') | flatten
        | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list
        | length == cluster_install_members | length
    fail_msg: "{{ cluster_name }} did not converge to the inventory membership."

- name: Confirm compact and SNO masters remain schedulable
  ansible.builtin.command:
    argv: ["{{ install_bin_dir }}/oc", get, scheduler, cluster, '-o', 'jsonpath={.spec.mastersSchedulable}']
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: cluster_install_scheduler
  changed_when: false
  failed_when: cluster_install_scheduler.stdout | trim != 'true'
