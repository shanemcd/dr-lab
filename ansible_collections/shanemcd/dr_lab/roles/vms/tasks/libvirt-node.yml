---
# Check identity before touching any per-node runtime media or definitions.
- name: Query the defined domain inventory
  ansible.builtin.command:
    argv: [virsh, -c, "{{ libvirt_uri }}", list, --all, --name]
  register: vms_defined_domains
  changed_when: false

- name: Check whether this domain is defined
  ansible.builtin.command:
    argv: [virsh, -c, "{{ libvirt_uri }}", dominfo, "{{ node.name }}"]
  register: vms_domain_info
  changed_when: false
  failed_when: vms_domain_info.rc != 0 and node.name in vms_defined_domains.stdout_lines
  environment: {LC_ALL: C}

- name: Refuse to overwrite an unrelated same-name domain
  ansible.builtin.assert:
    that: "(node.name | to_uuid) in vms_domain_info.stdout"
    fail_msg: "Domain name is already in use with a different UUID; choose a different lab node name."
  when: vms_domain_info.rc == 0

- name: Create the private libvirt runtime directory
  ansible.builtin.file:
    path: "{{ libvirt_runtime_dir }}"
    state: directory
    owner: qemu
    group: qemu
    mode: '0700'

- name: Stage the node's install target without modifying the original
  # The workspace original is the re-run-stable copy (created blank, kept
  # across re-runs); libvirt's runtime copy is the one the guest writes.
  # force=false keeps an already-written runtime disk across re-runs.
  ansible.builtin.copy:
    src: "{{ vm_images_dir }}/{{ node.name }}.qcow2"
    dest: "{{ libvirt_runtime_dir }}/{{ node.name }}.qcow2"
    remote_src: true
    owner: qemu
    group: qemu
    mode: "0600"
    force: false

- name: Create the dedicated ODF data disk once
  ansible.builtin.command:
    argv: [qemu-img, create, '-f', raw, "{{ libvirt_runtime_dir }}/{{ node.name }}-data.raw", "{{ node.data_disk }}"]
    creates: "{{ libvirt_runtime_dir }}/{{ node.name }}-data.raw"
  when: node.data_disk | default('', true) | length > 0

- name: Assign data disk ownership to libvirt
  ansible.builtin.file:
    path: "{{ libvirt_runtime_dir }}/{{ node.name }}-data.raw"
    owner: qemu
    group: qemu
    mode: '0600'
  when: node.data_disk | default('', true) | length > 0

- name: Stage the node's private ignition for libvirt
  ansible.builtin.copy:
    src: "{{ vm_ignition_dir }}/{{ node.name }}.ign"
    dest: "{{ libvirt_runtime_dir }}/{{ node.name }}.ign"
    remote_src: true
    owner: qemu
    group: qemu
    mode: "0600"
  diff: false
  no_log: true

- name: Stage the prepared boot ISO
  ansible.builtin.copy:
    src: "{{ vm_images_dir }}/{{ vms_master_iso_name }}"
    dest: "{{ libvirt_runtime_dir }}/{{ vms_master_iso_name }}"
    remote_src: true
    force: false
    mode: "0644"

- name: Render the persistent domain definition
  ansible.builtin.template:
    src: domain.xml.j2
    dest: "{{ vm_run_dir }}/{{ node.name }}.xml"
    mode: '0644'
  register: vms_domain_xml

- name: Define the lab domain
  ansible.builtin.command:
    argv: [virsh, -c, "{{ libvirt_uri }}", define, --validate, "{{ vm_run_dir }}/{{ node.name }}.xml"]
  changed_when: true
  when: vms_domain_xml.changed or vms_domain_info.rc != 0

- name: Enable domain autostart
  ansible.builtin.command:
    argv: [virsh, -c, "{{ libvirt_uri }}", autostart, "{{ node.name }}"]
  changed_when: true
  when: not (vms_domain_info.stdout is search('Autostart:\s+enable'))

- name: Retain read-only compatibility paths for existing operational checks
  ansible.builtin.file:
    src: "{{ item.source }}"
    dest: "{{ item.target }}"
    state: link
    force: true
  loop:
    - source: "/run/libvirt/qemu/{{ node.name }}.pid"
      target: "{{ vm_run_dir }}/{{ node.name }}.pid"
    - source: "/var/log/libvirt/qemu/{{ node.name }}.serial.log"
      target: "{{ vm_logs_dir }}/{{ node.name }}.serial.log"
