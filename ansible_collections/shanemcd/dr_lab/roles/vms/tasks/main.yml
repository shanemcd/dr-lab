---
# Persistent masters and temporary bootstrap guests use the same supported
# live-ISO -> coreos-installer -> disk boot path. Never recreate bootstrap
# guests after the installer has reported bootstrap-complete.
- name: Inspect bootstrap completion markers
  ansible.builtin.stat:
    path: "{{ install_base_dir }}/{{ item.cluster }}/bootstrap-complete"
  loop: "{{ bootstrap_nodes }}"
  register: vms_bootstrap_markers

- name: Select guests needed by this install
  ansible.builtin.set_fact:
    vms_nodes: >-
      {{ lab_nodes + (vms_bootstrap_markers.results | rejectattr('stat.exists')
                      | map(attribute='item') | list) }}

- name: Check the prepared node ignition files
  ansible.builtin.stat:
    path: "{{ vm_ignition_dir }}/{{ item.name }}.ign"
  loop: "{{ vms_nodes }}"
  register: vms_ignition_stat

- name: Require ignition for every selected guest
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "Missing ignition for {{ item.item.name }}; run 04_ignition first."
  loop: "{{ vms_ignition_stat.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Ensure VM asset directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ vm_images_dir }}"
    - "{{ vm_logs_dir }}"
    - "{{ vm_scripts_dir }}"
    - "{{ vm_run_dir }}"

- name: Create root install targets once
  ansible.builtin.command:
    argv: [qemu-img, create, '-f', qcow2, "{{ vm_images_dir }}/{{ item.name }}.qcow2", "{{ item.disk }}"]
    creates: "{{ vm_images_dir }}/{{ item.name }}.qcow2"
  loop: "{{ vms_nodes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Copy the unmodified live ISO once
  ansible.builtin.copy:
    src: "{{ rhcos_live_iso_path }}"
    dest: "{{ vm_images_dir }}/{{ vms_master_iso_name }}"
    remote_src: true
    mode: '0644'
    force: false

- name: Read current ISO kernel arguments
  ansible.builtin.command:
    argv: [coreos-installer, iso, kargs, show, "{{ vm_images_dir }}/{{ vms_master_iso_name }}"]
  register: vms_kargs_show
  changed_when: false

- name: Set missing boot arguments
  ansible.builtin.command:
    argv:
      - coreos-installer
      - iso
      - kargs
      - modify
      - --append
      - "{{ vms_iso_kargs | reject('in', vms_kargs_show.stdout) | join(' ') }}"
      - "{{ vm_images_dir }}/{{ vms_master_iso_name }}"
  when: vms_iso_kargs | reject('in', vms_kargs_show.stdout) | list | length > 0
  changed_when: true

- name: Stage and define the selected guests
  ansible.builtin.include_tasks: libvirt-node.yml
  loop: "{{ vms_nodes }}"
  loop_control:
    loop_var: node
    label: "{{ node.name }}"

- name: Inspect guest state
  ansible.builtin.command:
    argv: [virsh, '-c', "{{ libvirt_uri }}", dominfo, "{{ item.name }}"]
  loop: "{{ vms_nodes }}"
  register: vms_dominfo
  changed_when: false
  environment: {LC_ALL: C}

- name: Start inactive guests
  ansible.builtin.command:
    argv: [virsh, '-c', "{{ libvirt_uri }}", start, "{{ item.item.name }}"]
  loop: "{{ vms_dominfo.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not (item.stdout is search('State:\s+running'))
  changed_when: true

- name: Wait for guest kernel evidence
  ansible.builtin.command:
    argv: [grep, '-q', "{{ vms_boot_marker }}", "/var/log/libvirt/qemu/{{ item.name }}.serial.log"]
  loop: "{{ vms_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  register: vms_boot_check
  until: vms_boot_check.rc == 0
  retries: "{{ vms_boot_marker_retries }}"
  delay: "{{ vms_boot_marker_delay }}"
  changed_when: false
