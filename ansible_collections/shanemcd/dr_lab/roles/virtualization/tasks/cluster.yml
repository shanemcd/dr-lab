---
# Per-cluster OpenShift Virtualization install. Deliberately `oc` and not
# kubernetes.core.k8s (same convention as cluster_install): the k8s action
# plugin reads the kubeconfig on the controller as the invoking user, and
# the per-cluster kubeconfigs are root-owned 0600.

- name: Set per-cluster facts
  ansible.builtin.set_fact:
    cluster_name: "{{ sno_node.name }}"
    cluster_kubeconfig: "{{ install_base_dir }}/{{ sno_node.name }}/auth/kubeconfig"

- name: Ensure the OpenShift Virtualization namespace
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - apply
      - "-f"
      - "-"
    stdin: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: {{ virtualization_namespace }}
        labels:
          openshift.io/cluster-monitoring: "true"
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: virtualization_ns_result
  changed_when: "'created' in virtualization_ns_result.stdout"

- name: Ensure the OperatorGroup and Subscription
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - apply
      - "-f"
      - "-"
    stdin: |
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: {{ virtualization_operatorgroup }}
        namespace: {{ virtualization_namespace }}
      # CSV publishes OwnNamespace only — target the operator's own
      # namespace (an empty targetNamespaces list would select ALL
      # namespaces and the install would be rejected).
      spec:
        targetNamespaces:
          - {{ virtualization_namespace }}
      ---
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: {{ virtualization_package }}
        namespace: {{ virtualization_namespace }}
      spec:
        channel: {{ virtualization_channel }}
        installPlanApproval: Automatic
        name: {{ virtualization_package }}
        source: redhat-operators
        sourceNamespace: openshift-marketplace
        config:
          env:
            - name: KVM_EMULATION
              value: {{ (virtualization_use_emulation | bool | ternary('true', 'false')) | to_json }}
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: virtualization_sub_result
  changed_when: "'created' in virtualization_sub_result.stdout or 'configured' in virtualization_sub_result.stdout"

- name: Resolve this virtualization subscription's installed CSV
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - get
      - subscriptions.operators.coreos.com
      - "{{ virtualization_package }}"
      - "-n"
      - "{{ virtualization_namespace }}"
      - "-o"
      - 'jsonpath={.status.installedCSV}'
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: virtualization_csv_created
  until: virtualization_csv_created.rc == 0 and virtualization_csv_created.stdout | length > 0
  retries: 30
  delay: 10
  changed_when: false

- name: Wait for the operator CSV to report Succeeded
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - wait
      - "--for=jsonpath={.status.phase}=Succeeded"
      - "csv/{{ virtualization_csv_created.stdout }}"
      - "-n"
      - "{{ virtualization_namespace }}"
      - "--timeout={{ (virtualization_csv_timeout_minutes | int) * 60 }}s"
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  changed_when: false

- name: Ensure the HyperConverged custom resource
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - apply
      - "-f"
      - "-"
    stdin: |
      apiVersion: hco.kubevirt.io/v1beta1
      kind: HyperConverged
      metadata:
        name: {{ virtualization_hco_name }}
        namespace: {{ virtualization_namespace }}
      spec: {}
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: virtualization_hco_result
  changed_when: "'created' in virtualization_hco_result.stdout"

- name: Wait for the HyperConverged Available condition
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - wait
      - "--for=jsonpath={.status.conditions[?(@.type=='Available')].status}=True"
      - "hco/{{ virtualization_hco_name }}"
      - "-n"
      - "{{ virtualization_namespace }}"
      - "--timeout={{ (virtualization_hco_timeout_minutes | int) * 60 }}s"
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  changed_when: false

- name: Verify HCO reconciled the explicit software-emulation setting
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - get
      - kubevirt
      - "-n"
      - "{{ virtualization_namespace }}"
      - "-o"
      - 'jsonpath={.items[*].spec.configuration.developerConfiguration.useEmulation}'
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: virtualization_emulation_observed
  until: >-
    virtualization_emulation_observed.rc == 0 and
    virtualization_emulation_observed.stdout == 'true'
  retries: 60
  delay: 10
  changed_when: false
  when: virtualization_use_emulation | bool

- name: Require native KubeVirt execution configuration
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - get
      - kubevirt
      - '-n'
      - "{{ virtualization_namespace }}"
      - '-o'
      - json
      - '--request-timeout=30s'
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: virtualization_native_observed
  until: >-
    virtualization_native_observed.rc == 0 and
    (virtualization_native_observed.stdout | from_json)['items'] | length == 1 and
    not ((virtualization_native_observed.stdout | from_json)['items'][0].spec
    .get('configuration', {}).get('developerConfiguration', {}).get('useEmulation', false) | bool)
  retries: 30
  delay: 10
  changed_when: false
  when: not virtualization_use_emulation | bool

- name: Let the virt deployment fleet settle
  ansible.builtin.command:
    argv:
      - sleep
      - "{{ virtualization_settle_delay_seconds | int | string }}"
  changed_when: false

- name: Read the virt deployment readiness
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - get
      - deployments
      - "-n"
      - "{{ virtualization_namespace }}"
      - "-o"
      - json
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  register: virtualization_deployments
  changed_when: false

- name: Assert every virt deployment is fully ready
  ansible.builtin.assert:
    that:
      - (virtualization_deployments.stdout | from_json)['items'] | length > 0
      - item.status.readyReplicas | default(0) | int == item.spec.replicas | default(1) | int
      - item.status.updatedReplicas | default(0) | int == item.spec.replicas | default(1) | int
      - item.status.observedGeneration | default(0) | int >= item.metadata.generation | int
    fail_msg: "{{ cluster_name }} deployment/{{ item.metadata.name }} is not fully rolled out."
  loop: "{{ (virtualization_deployments.stdout | from_json)['items'] }}"
  loop_control:
    label: "{{ item.metadata.name }}"

# Extended resources are integer quantities; the API serializes 1000 as "1k".
# Accept positive integer SI/binary forms, not missing/zero/negative capacities.
- name: Require allocatable KVM on every managed node
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - get
      - node
      - "{{ item.name }}"
      - '-o'
      - json
      - '--request-timeout=30s'
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig }}"
  loop: "{{ lab_nodes | selectattr('cluster', 'equalto', cluster_name) | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: virtualization_node_kvm
  until: >-
    virtualization_node_kvm.rc == 0 and
    ((virtualization_node_kvm.stdout | from_json).status.get('allocatable', {})
    .get('devices.kubevirt.io/kvm', '0') | string | regex_search('^[1-9][0-9]*([kMGTPE]i?)?$')) is not none
  retries: 30
  delay: 10
  changed_when: false
  when: not virtualization_use_emulation | bool

- name: Cluster virtualization summary
  ansible.builtin.debug:
    msg: >-
      {{ cluster_name }} virtualization OK — operator CSV Succeeded
      ({{ virtualization_channel }}), HCO {{ virtualization_hco_name }}
      Available, {{ (virtualization_deployments.stdout | from_json)['items'] | length }}
      deployments ready in {{ virtualization_namespace }}.
