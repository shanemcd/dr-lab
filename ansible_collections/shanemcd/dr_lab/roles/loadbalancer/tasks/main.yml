---
- name: Install the distribution load balancer
  ansible.builtin.package:
    name:
      - haproxy
      - policycoreutils-python-utils
      - python3-libsemanage
    state: present

- name: Detect SELinux enforcement without relying on gathered facts
  ansible.builtin.stat:
    path: /sys/fs/selinux/enforce
  register: lb_selinux

- name: Allow HAProxy to bind the OpenShift API and machine config ports
  community.general.seport:
    ports: '6443,22623'
    proto: tcp
    setype: http_port_t
    state: present
  when: lb_selinux.stat.exists

- name: Allow HAProxy backend connections through the distribution SELinux policy
  ansible.posix.seboolean:
    name: haproxy_connect_any
    state: true
    persistent: true
  when: lb_selinux.stat.exists

- name: Create the private lab load balancer configuration directory
  ansible.builtin.file:
    path: "{{ loadbalancer_state_dir }}"
    state: directory
    mode: '0755'

- name: Inspect bootstrap completion markers
  ansible.builtin.stat:
    path: "{{ install_base_dir }}/{{ item.name }}/bootstrap-complete"
  loop: "{{ compact_clusters }}"
  register: lb_markers

- name: Collect completed cluster names
  ansible.builtin.set_fact:
    lb_completed_clusters: >-
      {{ lb_markers.results | selectattr('stat.exists') | map(attribute='item.name') | list }}

- name: Render and validate the load balancer configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ loadbalancer_state_dir }}/haproxy.cfg"
    mode: '0644'
    validate: '/usr/sbin/haproxy -c -f %s'
  register: lb_cfg

- name: Install the dedicated lab load balancer unit
  ansible.builtin.template:
    src: dr-lab-lb.service.j2
    dest: /etc/systemd/system/dr-lab-lb.service
    mode: '0644'
  register: lb_unit

- name: Enable the lab load balancer
  ansible.builtin.systemd_service:
    name: dr-lab-lb.service
    state: "{{ 'restarted' if lb_cfg.changed or lb_unit.changed else 'started' }}"
    enabled: true
    daemon_reload: "{{ lb_unit.changed }}"

- name: Require an actual API listener rather than only an accepted systemd start
  ansible.builtin.wait_for:
    host: "{{ item.api_vip }}"
    port: 6443
    state: started
    timeout: 30
    connect_timeout: 2
  loop: "{{ compact_clusters }}"
  loop_control:
    label: "{{ item.name }}"
