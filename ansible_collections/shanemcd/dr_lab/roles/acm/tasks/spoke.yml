---
# Import one spoke into the ACM hub: namespace + ManagedCluster
# (hubAcceptsClient) + auto-import-secret carrying the spoke kubeconfig.
# The secret task is no_log — the kubeconfig is a cluster credential.
- name: Ensure the spoke namespace and ManagedCluster on the hub
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - apply
      - "-f"
      - "-"
    stdin: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: {{ acm_spoke_name }}
      ---
      apiVersion: cluster.open-cluster-management.io/v1
      kind: ManagedCluster
      metadata:
        name: {{ acm_spoke_name }}
        labels:
          cloud: auto-detect
          vendor: auto-detect
      spec:
        hubAcceptsClient: true
        leaseDurationSeconds: 60
  environment:
    KUBECONFIG: "{{ acm_hub_kubeconfig }}"
  register: acm_spoke_mc_result
  changed_when: "'created' in acm_spoke_mc_result.stdout"

- name: Ensure the spoke auto-import secret
  # Generated by oc itself (create --dry-run piped to apply): building the
  # Secret YAML by hand risks block-scalar indentation bugs against the
  # multiline kubeconfig. Idempotent; ACM consumes and typically deletes
  # the auto-import secret after a successful import.
  ansible.builtin.shell: |
    set -o pipefail
    {{ install_bin_dir }}/oc create secret generic auto-import-secret \
      -n {{ acm_spoke_name }} \
      --from-file=kubeconfig={{ install_base_dir }}/{{ acm_spoke_name }}/auth/kubeconfig \
      --dry-run=client -o yaml \
      | {{ install_bin_dir }}/oc apply -f -
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ acm_hub_kubeconfig }}"
  no_log: true
  register: acm_spoke_secret_result
  changed_when: >-
    'created' in acm_spoke_secret_result.stdout
    or 'configured' in acm_spoke_secret_result.stdout

- name: Wait for the spoke ManagedCluster to become Available
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - wait
      - "--for=condition=ManagedClusterConditionAvailable=True"
      - "managedcluster/{{ acm_spoke_name }}"
      - "--timeout={{ (acm_import_timeout_minutes | int) * 60 }}s"
  environment:
    KUBECONFIG: "{{ acm_hub_kubeconfig }}"
  changed_when: false

- name: Ensure the spoke add-ons on the hub
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - apply
      - "-f"
      - "-"
    stdin: |
      {% for addon in acm_spoke_addons %}
      ---
      apiVersion: addon.open-cluster-management.io/v1alpha1
      kind: ManagedClusterAddOn
      metadata:
        name: {{ addon }}
        namespace: {{ acm_spoke_name }}
      spec:
        installNamespace: open-cluster-management-agent-addon
      {% endfor %}
  environment:
    KUBECONFIG: "{{ acm_hub_kubeconfig }}"
  register: acm_spoke_addon_result
  changed_when: "'created' in acm_spoke_addon_result.stdout"

- name: Wait for the spoke add-ons to be Available
  ansible.builtin.command:
    argv:
      - "{{ install_bin_dir }}/oc"
      - wait
      - "--for=condition=Available=True"
      - "managedclusteraddon/{{ acm_spoke_addon }}"
      - "-n"
      - "{{ acm_spoke_name }}"
      - "--timeout={{ (acm_addon_timeout_minutes | int) * 60 }}s"
  environment:
    KUBECONFIG: "{{ acm_hub_kubeconfig }}"
  loop: "{{ acm_spoke_addons }}"
  loop_control:
    loop_var: acm_spoke_addon
  changed_when: false
