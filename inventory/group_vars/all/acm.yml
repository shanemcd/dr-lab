---
# Full ACM is required by Regional-DR (Search, policies and Submariner).
# MultiClusterHub owns its bundled MCE; do not install a second standalone MCE.
acm_cluster: dr-hub
acm_spokes:
  - dr-primary
  - dr-recovery
acm_namespace: open-cluster-management
acm_operatorgroup: open-cluster-management
acm_channel: release-2.17
acm_package: advanced-cluster-management
acm_cr_name: multiclusterhub

# Search is available with full ACM. Submariner is configured by the DR layer.
acm_spoke_addons:
  - work-manager
  - cluster-proxy
  - search-collector
  # Ramen distributes S3 credentials through ACM governance policies.
  # A Running MultiClusterHub alone does not install spoke policy agents.
  - governance-policy-framework
  - config-policy-controller

acm_csv_timeout_minutes: 20
acm_cr_timeout_minutes: 30
acm_import_timeout_minutes: 20
acm_addon_timeout_minutes: 20
