---
# Host preparation knobs. This lab needs NO RHSM entitlement (GA mirror +
# quay payload only), so rhsm_required is false; the assert is skipped
# entirely.
rhsm_required: false
rhsm_username: ""
rhsm_password: ""
rhsm_org_id: ""
rhsm_activationkey: ""

# Common packages plus native QEMU and UEFI firmware for the host distribution.
host_packages: >-
  {{ host_common_packages + lab_arch_profile[
     'fedora_packages' if lab_host_distribution == 'Fedora' else 'rhel_packages'] }}
host_common_packages:
  - chrony
  - tar
  - podman
  - iptables
  - qemu-img
  - python3-pip
  - policycoreutils-python-utils
  - openssh-clients
  - bind-utils
  - dnsmasq
  - libvirt-client
  - libvirt-daemon-driver-qemu
  - libvirt-daemon-driver-network
  - psmisc
  - coreos-installer
  - firewalld

# Python library required on the host by kubernetes.core modules.
python_kubernetes_package: "python3-kubernetes"
