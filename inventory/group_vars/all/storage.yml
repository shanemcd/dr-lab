---
# Three failure domains per managed cluster, one dedicated raw disk per node.
storage_clusters: [dr-primary, dr-recovery]
storage_lso_namespace: openshift-local-storage
storage_lso_channel: stable
storage_odf_namespace: openshift-storage
storage_odf_channel: stable-4.22
storage_cluster_name: ocs-storagecluster
storage_odf_operatorgroup: odf-operatorgroup
storage_local_devices: [/dev/vdb]
storage_lso_storageclass: localblock
# qemu-img 120G is 120 GiB; leave headroom for local PV capacity rounding.
storage_device_request: 119Gi
storage_rbd_storageclass: ocs-storagecluster-ceph-rbd
