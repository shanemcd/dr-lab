---
# Lab network. lab_subnet_prefix is the source of truth; every address
# derives as {{ lab_subnet_prefix }}.{{ <x>_suffix }} and never restates the
# prefix. No load balancer and no VIPs: each SNO serves its own API and
# (pinned) ingress on its own IP. Libvirt's dedicated dnsmasq listens on
# the gateway — load-bearing because ignition fetches its config BEFORE
# applying storage/files, so the initramfs must resolve api-int (via
# DHCP-provided resolver) before the node's static keyfile exists.
#
# Each cluster domain gets: api/api-int + concrete route host records
# (wildcard alone failed install-time DNS checks in the ocp-lab) + a
# wildcard *.apps address entry per cluster.
lab_subnet_prefix: "192.168.126"
lab_subnet_netmask: "255.255.255.0"
lab_subnet_cidr: "{{ lab_subnet_prefix }}.0/24"
base_domain: "ocp.lab"

# Libvirt persistently defines this network and owns its bridge, NAT,
# guest interfaces, and DNS/DHCP process. Network and domains autostart.
# Kernel ifnames cap at 15 chars.
lab_bridge_name: "drbr0"
libvirt_network_name: "dr-lab"

host_gateway_suffix: 1

# Egress probe (veth+netns tap emulation) address suffix — must not collide
# with the gateway or any node suffix (the role asserts this).
network_probe_suffix: 250

# API endpoints and pinned ingress route names all live on each SNO's own
# IP (no VIPs). Built per cluster from sno_nodes; used by /etc/hosts, the
# libvirt DNS host records, and the node's /etc/hosts machine-config.
network_hosts_block: >-
  {%- set lines = [] -%}
  {%- for node in sno_nodes -%}
  {%- set cd = node.domain -%}
  {%- set _ = lines.append(node.ip ~ ' api.' ~ cd ~ ' api-int.' ~ cd) -%}
  {%- set _ = lines.append(node.ip ~ ' console-openshift-console.apps.' ~ cd
        ~ ' oauth-openshift.apps.' ~ cd
        ~ ' canary-openshift-ingress-canary.apps.' ~ cd) -%}
  {%- set _ = lines.append(node.ip ~ ' default-route-openshift-image-registry.apps.' ~ cd) -%}
  {%- endfor -%}
  {{ lines }}

# Convenience derivations (single source of truth = the suffixes above).
lab_gateway_ip: "{{ lab_subnet_prefix }}.{{ host_gateway_suffix }}"

# Per-cluster derivations (loop over sno_nodes / clusters).
cluster_domain: "{{ cluster_name }}.{{ base_domain }}"
cluster_ip: "{{ lab_subnet_prefix }}.{{ cluster_ip_suffix }}"

# Web console (ingress on each SNO).
console_url: "https://console-openshift-console.apps.{{ cluster_domain }}"

# Upstream resolvers: the lab resolver (dnsmasq on the gateway) forwards
# non-lab names here — guest NM keyfiles point at the gateway, which
# forwards. An EMPTY list auto-detects from the lab host.
upstream_dns_servers: []

# Auto-detected upstream candidates to always reject: split-horizon
# resolvers that answer AUTHORITATIVE SERVFAIL for names outside their
# own zone (e.g. the Tailscale MagicDNS resolver).
upstream_dns_blocklist:
  - "100.100.100.100"

# Cluster-internal SDN (install-config networking block) — clusterNetwork
# and serviceNetwork are PER CLUSTER (see topology.yml); only these knobs
# are fleet-wide.
cluster_network_type: "OVNKubernetes"
cluster_network_host_prefix: 23

# Reversible host-network changes (shared by network + teardown — role
# defaults never cross roles). Teardown reverses exactly these. The bridge
# carries only the gateway address (no DNS or VIP addresses).
network_sysctl_conf_name: "99-dr-lab.conf"
# DHCP free-range suffixes (reservations pin the nodes; unknown clients
# only get addresses from this narrow, collision-asserted segment).
network_dhcp_range_start_suffix: 200
network_dhcp_range_end_suffix: 209
network_bridge_addresses:
  - "{{ lab_subnet_prefix }}.{{ host_gateway_suffix }}/24"
