---
# Secrets plumbing (paths only — never values). The base pull secret is
# required for install-config and registry auth; it must be valid JSON,
# mode 0600, and never committed.
install_pull_secret_path: "/root/pull-secret.txt"

# One ed25519 keypair shared by all three clusters (installer sshKey +
# host-side guest access via core@<node-ip>).
install_ssh_key_path: "{{ vm_assets_dir }}/secrets/lab_ed25519"
install_ssh_pubkey_path: "{{ install_ssh_key_path }}.pub"
